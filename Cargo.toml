[package]
name = "static_vis"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
bytemuck = { version = "1.25.2", features = ["derive"] }
clap = { version = "4.6.7", features = ["derive"] }
hound = "3.5.1"
image = "0.25.10"
pollster = "1.0.1"
realfft = "3.5.0"
wgpu = "30.0.1"
winit = "0.30.13"

[[bin]]
name = "static"
path = "src/main.rs"

# Optimise dependencies even in debug builds: image resizing and GPU setup are
# painfully slow unoptimised, while our own code stays quick to compile.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
