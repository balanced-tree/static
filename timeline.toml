# still, charged: the timeline. Hot-reloaded by `static preview` on save.
#
# Times: "6s", "800ms", "3:10", "1:02:03.5" or a plain number of seconds.
# Paths are relative to this file. Missing photos show the test card and a
# missing font hides the title (with a warning), so this previews before the
# material exists.

[meta]
audio = "audio/Still, charged.wav"
# features = "out/still_charged.features.bin"   # else analysed on the fly
fps = 25
seed = 1234

# Opening: what shows before the first cue's photo, and how it resolves.
[intro]
scene = "static"                  # "static" | "black" | "photo" (first cue's photo from the start)
hold = "30s"                      # how long it stays
resolve = "8s"                    # transition into the first cue's photo, starting at `hold`
transition = "noise_dissolve"     # "noise_dissolve" | "dissolve" | "cut"
# Parameter groups work here too, as the starting values:
# stillness = { mode = "always_restless" }
colour = { saturation = 0.0 }     # black and white throughout
# Soft passages shouldn't shake the picture: no jitter below the threshold,
# and less hiss in the mix (hiss is high even when the sound is quiet).
jitter_mix = { hiss = 0.2, click = 0.2, loud = 0.7, threshold = 0.4 }

[title]
text = "still, charged"
subtitle = ""
font = "fonts/Irritation.ttf"          # any TTF/OTF
size = 0.12                      # cap height, fraction of frame height
subtitle_size = 0.022
position = [0.5, 0.5]             # normalised centre
align = "center"                  # "left" | "center" | "right"
colour = "#e6e6e6"
letter_spacing = 0.08             # em
appear = "2s"
reveal = "noise"                  # "noise" (resolves out of the static) | "fade" | "cut"
reveal_time = "2.5s"
hold = "27s"
vanish = "noise"
vanish_time = "2.5s"
disturb = 0.5                     # 0 = clean overlay, 1 = tears and dissolves with the signal

# Cues. A cue may change the scene (`photo`, or `scene = "static" | "black"`)
# and/or any parameters. Scene changes start at `at` and take `crossfade`.
# Parameters start moving at `at` and arrive after `ramp` ("4s" default;
# "next" drifts until the next cue), shaped by `ease` ("smooth" | "linear" |
# "step"). Anything a cue doesn't mention keeps its value.
#
# Parameter groups (the preview's sliders, and "Copy as TOML", use the same names):
#   stillness  = { mode = "still_at_rest" | "always_restless" | "inverted", baseline, response, invert }
#   snow_mix / jitter_mix / tear_mix / chroma_mix = { hiss, click, loud, threshold }
#   hiss / loud = { attack, release, gain, curve }      clicks = { decay, gain }
#   snow = { rows }     crt = { scanlines, vignette, bloom, persistence }
#   colour = { saturation, chroma_split, contrast, black_level, tint = "#rrggbb" }
#   react  = { background, image, edge, edge_width }    which parts carry the disturbance, 0..1
#            (default 1, 1, 0: everything). { background = 0 } keeps the black around the photo
#            still; { background = 0, image = 0, edge = 1 } makes only the photo's outline react.
#
# A photo cue can also shrink and place its photo so the background shows around it:
#   scale = 0.6, position = [0.5, 0.5]   (box size as a fraction of the frame; its centre)
# PNG transparency and SVGs work too: the outline is then the drawn shape.

[[cue]]
at = "0:30"
photo = "photos/7.png"
fit = "fill"                      # "fill" crops to 16:9 | "contain" letterboxes
focus = [0.45, 0.55]              # crop centre for "fill"
# soften = 0.5                    # blur + coarser grain for a heavily upscaled photo
scale = 0.6                     # try with react below: only the photo reacts
react = { background = 0.0, image = 0.9, edge = 1.0 }    # or { background = 0.0, image = 0.0, edge = 1.0 }
stillness = { mode = "still_at_rest" }

[[cue]]
at = "1:15"
photo = "photos/8.png"
transition = "cut"
fit = "fill"                      # "fill" crops to 16:9 | "contain" letterboxes
focus = [0.45, 0.55]              # crop centre for "fill"
# soften = 0.5                    # blur + coarser grain for a heavily upscaled photo
scale = 0.6                     # try with react below: only the photo reacts
react = { background = 0.0, image = 0.0, edge = 1.0 }    # or { background = 0.0, image = 0.0, edge = 1.0 }
stillness = { mode = "still_at_rest" }

[[cue]]
at = "1:51"
photo = "photos/13.png"
crossfade = "4s"
transition = "noise_dissolve"
stillness = { baseline = 0.15 }
scale = 0.6                     # try with react below: only the photo reacts
react = { background = 0.0, image = 1.0, edge = 0.0 }    # or { background = 0.0, image = 0.0, edge = 1.0 }
ramp = "2s"

[[cue]]
