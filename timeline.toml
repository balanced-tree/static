# Ending, relative to the end of the audio.
[outro]
scene = "static"                  # "static" | "black" | "freeze" (last photo, perfectly still)
begin = "-10s"
crossfade = "6s"
transition = "noise_dissolve"
tail = "3s"                       # extra video after the audio ends
end_on = "black"                  # the final second: "black" | "static" | "cut" (no change)
